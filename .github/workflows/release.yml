name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: src/DodecaDev.PhilipsHue
      changelog: ${{ github.event.release.body }}
      # The default "newest prerelease" resolved to 3.0.0-beta.11, below the Store minimum. Bump when a newer CLI ships.
      cli-version: 3.0.0-beta.15
